{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="card p-5 mx-auto" style="max-width: 520px;">
        <h1 class="display-3 fw-bold text-primary mb-2">404</h1>
        <h4 class="fw-bold">Page Not Found</h4>
        <p class="text-muted">The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i> Go to Home
        </a>
    </div>
</div>
{% endblock %}
