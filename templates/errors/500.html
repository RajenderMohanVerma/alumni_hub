{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="card p-5 mx-auto" style="max-width: 520px;">
        <h1 class="display-3 fw-bold text-danger mb-2">500</h1>
        <h4 class="fw-bold">Something Went Wrong</h4>
        <p class="text-muted">There was an error on the server. Please try again after some time.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i> Go to Home
        </a>
    </div>
</div>
{% endblock %}
