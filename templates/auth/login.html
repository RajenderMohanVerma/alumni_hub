{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4">
                <h3 class="text-center fw-bold mb-1">
                    <i class="fas fa-sign-in-alt text-primary me-1"></i> Login
                </h3>
                <p class="text-center text-muted small mb-4">Welcome back to Alumni Hub</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <p class="text-center small mt-3 mb-0">
                    New here? <a href="{{ url_for('register') }}">Create an account</a>
                </p>

                <hr>
                <p class="small text-muted mb-2">
                    <strong>Demo accounts</strong> — kisi par bhi click karo,
                    email-password apne aap bhar jayega:
                </p>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-primary btn-sm demo-fill"
                            data-email="student@demo.com" data-password="student123">
                        <i class="fas fa-user-graduate me-1"></i> Student — student@demo.com
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm demo-fill"
                            data-email="alumni@demo.com" data-password="alumni123">
                        <i class="fas fa-briefcase me-1"></i> Alumni — alumni@demo.com
                    </button>
                    <button type="button" class="btn btn-outline-dark btn-sm demo-fill"
                            data-email="faculty@demo.com" data-password="faculty123">
                        <i class="fas fa-chalkboard-teacher me-1"></i> Faculty — faculty@demo.com
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-sm demo-fill"
                            data-email="admin@alumnihub.com" data-password="admin123">
                        <i class="fas fa-user-shield me-1"></i> Admin — admin@alumnihub.com
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Demo account buttons: clicking one fills the email and password
    // fields automatically, so the demo can be tried without typing.
    document.querySelectorAll('.demo-fill').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelector('input[name="email"]').value = btn.dataset.email;
            document.querySelector('input[name="password"]').value = btn.dataset.password;
        });
    });
</script>
{% endblock %}
