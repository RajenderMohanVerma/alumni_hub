{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h4 class="fw-bold mb-4"><i class="fas fa-pen text-primary me-1"></i> Edit Profile</h4>

                <form method="POST" enctype="multipart/form-data">
                    <div class="text-center mb-3">
                        <img src="{{ avatar_url(current_user) }}" class="avatar avatar-lg" alt="">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Profile Picture (PNG/JPG)</label>
                        <input type="file" name="profile_pic" class="form-control" accept=".png,.jpg,.jpeg">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ current_user.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ current_user.phone or '' }}">
                        </div>
                    </div>

                    {% if current_user.role == 'student' %}
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" name="course" class="form-control"
                                   placeholder="e.g. B.Tech / MCA" value="{{ profile.course or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Branch</label>
                            <input type="text" name="branch" class="form-control"
                                   placeholder="e.g. Computer Science" value="{{ profile.branch or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Year</label>
                            <input type="text" name="year" class="form-control"
                                   placeholder="e.g. 3rd Year" value="{{ profile.year or '' }}">
                        </div>
                    </div>
                    {% elif current_user.role == 'alumni' %}
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Company</label>
                            <input type="text" name="company" class="form-control"
                                   placeholder="e.g. TCS" value="{{ profile.company or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Designation</label>
                            <input type="text" name="designation" class="form-control"
                                   placeholder="e.g. Software Engineer" value="{{ profile.designation or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Experience</label>
                            <input type="text" name="experience" class="form-control"
                                   placeholder="e.g. 3 years" value="{{ profile.experience or '' }}">
                        </div>
                    </div>
                    {% elif current_user.role == 'faculty' %}
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control"
                                   placeholder="e.g. Computer Science" value="{{ profile.department or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Designation</label>
                            <input type="text" name="designation" class="form-control"
                                   placeholder="e.g. Professor" value="{{ profile.designation or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Qualification</label>
                            <input type="text" name="qualification" class="form-control"
                                   placeholder="e.g. PhD" value="{{ profile.qualification or '' }}">
                        </div>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Skills (comma separated)</label>
                        <input type="text" name="skills" class="form-control"
                               placeholder="e.g. Python, Java, SQL"
                               value="{{ profile.skills or '' if profile else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">About / Bio</label>
                        <textarea name="bio" class="form-control" rows="3"
                                  placeholder="Write a little about yourself...">{{ profile.bio or '' if profile else '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Save Changes
                    </button>
                    <a href="{{ url_for('profile', user_id=current_user.id) }}"
                       class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
