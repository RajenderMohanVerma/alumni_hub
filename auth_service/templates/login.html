{% extends "auth_base.html" %}
{% set active = "login" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="fw-bold text-center mb-1"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
        <p class="text-muted text-center">Welcome back to Alumni Hub</p>

        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" type="email" id="email" name="email"
                   placeholder="you@example.com" required value="{{ email }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Your password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>

        <!-- Demo accounts: one click fills the login form -->
        <div class="demo-box mt-4">
          <p class="fw-semibold mb-2 text-center">
            <i class="bi bi-lightning-charge"></i> Try a demo account — click to fill:
          </p>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary demo-fill"
                    data-email="student@demo.com" data-password="student123">
              <i class="bi bi-mortarboard"></i> Student
              <span class="demo-cred">student@demo.com / student123</span>
            </button>
            <button type="button" class="btn btn-outline-success demo-fill"
                    data-email="alumni@demo.com" data-password="alumni123">
              <i class="bi bi-award"></i> Alumni
              <span class="demo-cred">alumni@demo.com / alumni123</span>
            </button>
            <button type="button" class="btn btn-outline-warning demo-fill"
                    data-email="faculty@demo.com" data-password="faculty123">
              <i class="bi bi-person-video3"></i> Faculty
              <span class="demo-cred">faculty@demo.com / faculty123</span>
            </button>
            <button type="button" class="btn btn-outline-dark demo-fill"
                    data-email="admin@alumnihub.com" data-password="admin123">
              <i class="bi bi-shield-lock"></i> Admin
              <span class="demo-cred">admin@alumnihub.com / admin123</span>
            </button>
          </div>
        </div>

        <p class="text-center text-muted mt-3 mb-0">
          New to Alumni Hub? <a href="/register">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Click-to-fill demo accounts: put the email + password into the form
// and highlight the Login button - the user just presses Login.
document.querySelectorAll('.demo-fill').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.getElementById('email').value = btn.dataset.email;
    var pwd = document.getElementById('password');
    pwd.value = btn.dataset.password;
    pwd.focus();
  });
});
</script>
{% endblock %}
