{% extends "auth_base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="fw-bold text-center mb-1"><i class="bi bi-key"></i> Change Password</h3>
        <p class="text-muted text-center">
          Signed in as <strong>{{ user.name }}</strong> ({{ user.email }})
        </p>

        <form method="post" action="/change-password">
          <!-- The login token travels with the form: it proves to this
               service who is changing the password. -->
          <input type="hidden" name="token" value="{{ token }}">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" type="password" id="current_password"
                   name="current_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New password</label>
            <input class="form-control" type="password" id="new_password"
                   name="new_password" placeholder="Minimum 6 characters"
                   required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <input class="form-control" type="password" id="confirm_password"
                   name="confirm_password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-check-circle"></i> Change Password
          </button>
        </form>

        <p class="text-center mt-3 mb-0">
          <a href="{{ app_url }}/dashboard">Back to Dashboard</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
